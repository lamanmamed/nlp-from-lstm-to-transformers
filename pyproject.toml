[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-from-lstm-to-transformers"
version = "0.1.0"
description = "NLP models for translation, sentiment analysis, humour score prediction, text generation, and summarization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
transformers = [
    "transformers>=4.48",
    "datasets>=3.0",
    "evaluate>=0.4",
    "sacrebleu>=2.4",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
